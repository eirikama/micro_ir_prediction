[project]
name            = "microplastics-predict"
version         = "0.1.0"
description     = "Hyperspectral FTIR microplastics classification"
requires-python = ">=3.12"

[tool.ruff]
line-length    = 100
target-version = "py312"
exclude = ["**/*.pyx", "**/*.pxd"]

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "B" ]
ignore = [ "E501", "B008", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.cython-lint]
ignore = ["E501"]
