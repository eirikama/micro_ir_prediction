[project]
name            = "microplastics-predict"
version         = "0.1.0"
description     = "Hyperspectral FTIR microplastics classification"
requires-python = ">=3.12"

[tool.ruff]
line-length    = 100
target-version = "py312"
exclude = ["**/*.pyx", "**/*.pxd"]

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "B" ]
ignore = [ "E501", "B008", "UP007"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
timeout      = 120   # seconds — any single test hanging longer than this fails
# Markers used in the test suite
markers = [
    "slow: marks tests that take more than a few seconds",
    "gpu:  marks tests that require a CUDA-capable GPU",
]

[tool.coverage.run]
source  = ["src"]
omit    = ["src/physics/*"]   # generated Cython C files skew coverage

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.cython-lint]
ignore = ["E501"]
