zarr_path: "/mnt/ssd3/eirik/ProcessedData/mlrod.zarr"
zarr_test_path: "/mnt/ssd3/eirik/ProcessedData/mlrod_test.zarr"

intrinsic_validation: False
spectra_per_class: 32
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 64
batch_size: 64
test_split_size: 0.5
val_split_size: 0.5

sample_min: 0.0
background_max: 0.0
include_bkg_pixels: False
z_normalize: True
augment_train: True
augment_val: False
test_sample_ratio: 1.0

modality: raman
augmentations:
  cosmic_rays:
    enabled: True
    ratio: 0.5
    spike_rate: 0.002
    amplitude_min: 3.0
    amplitude_max: 15.0
    max_width: 3

  fluorescence:
    enabled: True
    signal_only: True
    ratio: 0.5
    n_components: 5
    poly_degree: 3
    als_lam: 1.0e5
    als_p: 0.01
    fit_pool_size: 2000
    fit_pool_seed: 12345
    amplitude_min: 0.0
    amplitude_max: 0.25

  shot_noise:
    enabled: True
    ratio: 0.5
    scale: 0.075
    read_noise: 0.005
