zarr_path: "/mnt/ssd3/eirik/ProcessedData/microplastics_library.zarr"
intrinsic_validation: True
spectra_per_class: 64
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 64
batch_size: 64
test_split_size: 0.5
val_split_size: 0.5
hyperspectra: True

sample_min: 0.3
background_max: 0.05
include_bkg_pixels: True

z_normalize: True
augment_train: True
augment_val: False

modality: ir

preprocessing:
  enabled: False
  steps:
    - type: interpolate
      enabled: False
      start: 900
      stop: 3800
      num: 737
    - type: crop
      enabled: False
      keep: [[1000, 1800], [2800, 3000]]
    - type: dl_mie
      enabled: False
      expect_channels: 737
      model:
        _target_: src.models.mie_net.MieCorrectionNet
      checkpoint: null
      device: auto
      batch_size: 4096
    - type: emsc
      enabled: True
      poly_order: 2
    - type: savgol
      enabled: False
      window: 11
      polyorder: 3
      deriv: 1

augmentations:
  mie_scattering:
    enabled: True
    signal_only: True
    ratio: 0.5
    variant: spherical
    n0_min: 1.3
    n0_max: 1.65
    r_min: 3.0
    r_max: 17.0
    n_imag_min: 1.0e-5
    n_imag_max: 1.0e-1
    h_min: 1.0
    h_max: 2.0
    scale_min: 2.5
    scale_max: 5.5
    theta_min: 0.2
    theta_max: 0.45

  polynomial_baseline_signal:
    type: polynomial_baseline
    enabled: True
    signal_only: True
    ratio: 0.6
    param_ranges:
      - [0.0, 0.0]
      - [0.1, 4.0]
      - [-0.15, 0.15]
      - [-0.08, 0.08]

  polynomial_baseline_background:
    type: polynomial_baseline
    enabled: True
    background_only: True
    ratio: 0.6
    param_ranges:
      - [0.0, 0.0]
      - [0.01, 2.5]
      - [-0.10, 0.10]
      - [-0.05, 0.05]

  noise:
    enabled: True
    ratio: 0.5
    max_level: 0.01

  co2_peaks:
    enabled: False
    ratio: 0.2
    params: [2300, 2400, 10, 0.0, 0.4, 30, 5, 6]
