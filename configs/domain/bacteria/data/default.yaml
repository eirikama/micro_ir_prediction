zarr_path: "/mnt/ssd3/eirik/ProcessedData/bacteria/ho_reference.zarr"
zarr_test_path: "/mnt/ssd3/eirik/ProcessedData/bacteria/ho_bacteria_test.zarr"

intrinsic_validation: False
spectra_per_class: 64
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 64
batch_size: 64
train_split_size: 0.5
val_split_size: 0.5

sample_min: 0.0
background_max: 0.0
include_bkg_pixels: False
z_normalize: True
augment_train: True
augment_val: True

modality: raman
augmentations:
  cosmic_rays:
    enabled: False
    ratio: 0.5
    spike_rate: 0.0002
    amplitude_min: 2.0
    amplitude_max: 5.0
    max_width: 3

  fluorescence:
    enabled: True
    signal_only: True
    ratio: 0.5
    n_components: 5
    poly_degree: 3
    amplitude_min: 0.0
    amplitude_max: 0.05

  shot_noise:
    enabled: True
    ratio: 0.5
    scale: 0.005
