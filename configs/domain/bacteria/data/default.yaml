zarr_path: "/mnt/ssd3/eirik/ProcessedData/bacteria/ho_reference.zarr"
zarr_test_path: "/mnt/ssd3/eirik/ProcessedData/bacteria/ho_bacteria_test.zarr"

intrinsic_validation: False
hyperspectra: False
spectra_per_class: 32
batch_size: 64
test_split_size: 0.5
val_split_size: 0.5

z_normalize: True
augment_train: True
augment_val: False
test_sample_ratio: 1.0

modality: raman

preprocessing:
  enabled: False
  steps:
    - type: als
      enabled: True
      lam: 1.0e5
      p: 0.01
    - type: savgol
      enabled: False
      window: 11
      polyorder: 3
      deriv: 1
    - type: snv
      enabled: False

augmentations:
  cosmic_rays:
    enabled: False
    ratio: 0.5
    spike_rate: 0.0002
    amplitude_min: 2.0
    amplitude_max: 5
    max_width: 3

  fluorescence:
    enabled: True
    signal_only: True
    ratio: 0.5
    n_components: 5
    poly_degree: 3
    als_lam: 1.0e5
    als_p: 0.01
    fit_pool_size: 2000
    fit_pool_seed: 12345
    amplitude_min: 0.0
    amplitude_max: 0.015

  shot_noise:
    enabled: True
    ratio: 0.7
    scale: 0.003
    read_noise: 0.005
