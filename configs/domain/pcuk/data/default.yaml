zarr_path: "/mnt/ssd3/eirik/ProcessedData/pcuk.zarr"
intrinsic_validation: True
classes:
  - "Normal epithelium"
  - "Normal stroma"
  - "Cancerous epithelium"
  - "Cancer-associated stroma"
spectra_per_class: 128
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 8
batch_size: 32
test_split_size: 0.5
val_split_size: 0.5
hyperspectra: False

sample_min: 0.
background_max: 0.0
include_bkg_pixels: False

z_normalize: True
augment_train: False
augment_val: False

modality: ir

preprocessing:
  enabled: False
  steps:
    - type: crop
      enabled: False
      keep: [[1000, 1800], [2800, 3000]]
    - type: emsc
      enabled: True
      poly_order: 2
    - type: savgol
      enabled: False
      window: 11
      polyorder: 3
      deriv: 1

augmentations:
  polynomial_baseline_signal:
    type: polynomial_baseline
    enabled: True
    signal_only: True
    ratio: 0.5
    p0_min: 0.0
    p0_max: 0.0
    p1_min: 0.25
    p1_max: 2.0
    p2_min: -0.15
    p2_max: 0.15
    p3_min: -0.08
    p3_max: 0.08

  noise:
    enabled: True
    ratio: 0.5
    max_level: 0.025

  co2_peaks:
    enabled: True
    ratio: 0.2
    loc1: 2300
    loc2: 2400
    d_loc: 10
    height: 0.0
    d_height: 0.4
    width: 30
    d_width: 5
    n_peaks: 6

  paraffin:
    type: paraffin
    enabled: True
    ratio: 0.4
    amplitude_min: 0.0
    amplitude_max: 2.
    randomise_bands: True

  wavenumber_shift:
    type: wavenumber_shift
    enabled: True
    ratio: 0.4
    shift_max: 30.0
    per_batch: False
