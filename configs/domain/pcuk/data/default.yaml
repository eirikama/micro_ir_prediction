zarr_path: "/mnt/ssd3/eirik/ProcessedData/pcuk.zarr"
intrinsic_validation: True
spectra_per_class: 64
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 64
batch_size: 16
train_split_size: 0.5
val_split_size: 0.2
hyperspectra: False

sample_min: 0.
background_max: 0.0
include_bkg_pixels: False

z_normalize: True
augment_train: False
augment_val: False

modality: ir
augmentations:
  polynomial_baseline_signal:
    type: polynomial_baseline
    enabled: True
    signal_only: True
    ratio: 0.5
    p0_min: -0.25
    p0_max: 0.5
    p1_min: 0.25
    p1_max: 2.0
    p2_min: -0.001
    p2_max: 0.001
    p3_min: -0.0001
    p3_max: -0.0001

  noise:
    enabled: True
    ratio: 0.5
    max_level: 0.01

  co2_peaks:
    enabled: True
    ratio: 0.2
    loc1: 2300
    loc2: 2400
    d_loc: 10
    height: 0.0
    d_height: 0.4
    width: 30
    d_width: 5
    n_peaks: 6

  paraffin:
    type: paraffin
    enabled: True
    ratio: 0.3
    amplitude_min: 0.0
    amplitude_max: 0.1
    randomise_bands: True

  wavenumber_shift:
    type: wavenumber_shift
    enabled: True
    ratio: 0.3
    shift_max: 2.0
    per_batch: False
