zarr_path: "/mnt/ssd3/eirik/ProcessedData/milk.zarr"
intrinsic_validation: True
spectra_per_class: 512
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 2
batch_size: 32
train_split_size: 0.5
val_split_size: 0.5
hyperspectra: False
sample_min: 0.
background_max: 0.0
include_bkg_pixels: False
z_normalize: False
augment_train: True
augment_val: False
modality: ir
augmentations:
  polynomial_baseline_signal:
    type: polynomial_baseline
    enabled: True
    signal_only: True
    ratio: 0.5
    p0_min: 0.
    p0_max: 0.5
    p1_min: 0.25
    p1_max: 2.0
    p2_min: -0.0005
    p2_max: 0.0005
    p3_min: -0.00001
    p3_max: -0.00001

  noise:
    enabled: True
    ratio: 0.5
    max_level: 0.001

