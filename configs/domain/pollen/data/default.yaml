zarr_path: "/mnt/ssd3/eirik/ProcessedData/ase_pollen_library.zarr"
intrinsic_validation: True
split_by_patient: False
hyperspectra: True
spectra_per_class: 64
sample_to_bkg_spectra_ratio: 2
max_sampling_per_class_attempts: 1000
sampling_patch_size: 64
batch_size: 64
test_split_size: 0.5
val_split_size: 0.5

sample_min: 0.3
background_max: 0.05
include_bkg_pixels: True

z_normalize: True
augment_train: True
augment_val: False

modality: ir

preprocessing:
  enabled: False
  steps:
    - type: crop
      enabled: False
      keep: [[1000, 1800], [2800, 3000]]
    - type: dl_mie
      enabled: False
      model:
        _target_: src.models.mie_net.MieCorrectionNet
      checkpoint: null
      device: auto
      batch_size: 4096
    - type: emsc
      enabled: True
      poly_order: 2
    - type: savgol
      enabled: False
      window: 11
      polyorder: 3
      deriv: 1

augmentations:
  mie_scattering:
    enabled: False
    signal_only: True
    ratio: 0.0
    variant: spherical
    n0_min: 1.25
    n0_max: 1.65
    r_min: 2.0
    r_max: 16.0
    n_imag_min: 1.0e-5
    n_imag_max: 1.0e-2
    h_min: 1.0
    h_max: 1.5
    scale_min: 2.5
    scale_max: 4.5
    theta_min: 0.2
    theta_max: 0.45

  polynomial_baseline_signal:
    type: polynomial_baseline
    enabled: False
    signal_only: True
    ratio: 0.0
    param_ranges:
      - [-1.0, 2.5]
      - [0.1, 4.0]
      - [-0.01, 0.01]
      - [-0.001, -0.001]

  polynomial_baseline_background:
    type: polynomial_baseline
    enabled: False
    background_only: True
    ratio: 0.0
    param_ranges:
      - [-2.0, 2.0]
      - [0.01, 2.5]
      - [-0.0001, 0.0001]
      - [-0.00001, -0.00001]

  noise:
    enabled: False
    ratio: 0.0
    max_level: 0.05

  co2_peaks:
    enabled: False
    ratio: 0.0
    params: [2300, 2400, 10, 0.0, 0.4, 30, 5, 6]
