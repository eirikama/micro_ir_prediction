_target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
storage: null
study_name: pcuk_augmentation_sweep
n_trials: 100
n_jobs: 1
direction: maximize
search_space: null
custom_search_space: null
sampler:
  _target_: optuna.samplers.TPESampler
  seed: 42
params:
  # ── training / optimiser ──────────────────────────────────────────────────
  model.lr: tag(log, interval(5e-7, 5e-3))
  model.weight_decay: tag(log, interval(1e-5, 1e-1))
  data.batch_size: choice(16, 32, 64)
  # ── model architecture ────────────────────────────────────────────────────
  model.conv_channels: choice(16, 32, 64)
  model.kernel_size: choice(7, 11, 21)
  model.pred_dropout: interval(0.0, 0.5)
  # ── augmentation: polynomial baseline ────────────────────────────────────
  data.augmentations.polynomial_baseline_signal.ratio: interval(0.1, 0.9)
  data.augmentations.polynomial_baseline_signal.p0_max: interval(0.1, 1.0)
  data.augmentations.polynomial_baseline_signal.p1_min: interval(0.0, 0.5)
  data.augmentations.polynomial_baseline_signal.p1_max: interval(0.5, 4.0)
  data.augmentations.polynomial_baseline_signal.p2_max: tag(log, interval(1e-4, 1e-2))
  # ── augmentation: noise ───────────────────────────────────────────────────
  data.augmentations.noise.ratio: interval(0.1, 0.9)
  data.augmentations.noise.max_level: tag(log, interval(5e-4, 2e-2))
  # ── augmentation: CO2 peaks ───────────────────────────────────────────────
  data.augmentations.co2_peaks.enabled: choice(true, false)
  data.augmentations.co2_peaks.ratio: interval(0.05, 0.5)
  data.augmentations.co2_peaks.d_height: interval(0.05, 0.8)
  # ── augmentation: paraffin ────────────────────────────────────────────────
  data.augmentations.paraffin.enabled: choice(true, false)
  data.augmentations.paraffin.ratio: interval(0.1, 0.5)
  data.augmentations.paraffin.amplitude_max: tag(log, interval(0.001, 0.3))
  # ── augmentation: wavenumber shift ────────────────────────────────────────────────
  data.augmentations.wavenumber_shift.ratio: interval(0.1, 0.9)
  data.augmentations.wavenumber_shift.shift_max: interval(0.5, 4.0)
