# Hyperparameter sweep config for the pollen (IR/FTIR) domain.
#
# The base domain config has augment_train=True but all augmentation entries
# are disabled (enabled: False, ratio: 0.0). This sweep explores whether
# enabling any of them actually helps, alongside the usual model/training params.
#
# Types are fixed — the list in configs/domain/pollen/data/default.yaml is not
# changed. Only `enabled` flags and numerical parameters are swept.
#
# Run:
#   python sweep.py --domain pollen
#   python sweep.py --domain pollen --n-trials 100 --storage sqlite:///pollen_sweep.db

study:
  name: pollen_augmentation_sweep
  direction: maximize
  n_trials: 100

base_overrides: {}

params:
  # ── training / optimiser ──────────────────────────────────────────────────
  model.lr:
    suggest: float_log
    low: 5.0e-6
    high: 5.0e-4

  model.weight_decay:
    suggest: float_log
    low: 1.0e-4
    high: 1.0e-2

  data.batch_size:
    suggest: categorical
    choices: [32, 64, 128]

  # ── model architecture ────────────────────────────────────────────────────
  model.conv_channels:
    suggest: categorical
    choices: [16, 32, 64]

  model.kernel_size:
    suggest: categorical
    choices: [7, 11, 21]

  model.pred_dropout:
    suggest: float
    low: 0.0
    high: 0.5

  model.gamma:
    suggest: float
    low: 0.0
    high: 3.0

  # ── augmentation: Mie scattering ──────────────────────────────────────────
  # Disabled in base config; sweep whether enabling it helps.
  augmentation.mie_scattering.enabled:
    suggest: categorical
    choices: [true, false]

  augmentation.mie_scattering.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.mie_scattering.r_min:
    suggest: float
    low: 1.0
    high: 5.0

  augmentation.mie_scattering.r_max:
    suggest: float
    low: 8.0
    high: 20.0

  augmentation.mie_scattering.n_imag_max:
    suggest: float_log
    low: 1.0e-4
    high: 1.0e-1

  augmentation.mie_scattering.scale_max:
    suggest: float
    low: 2.0
    high: 6.0

  # ── augmentation: polynomial baseline — signal ───────────────────────────
  # Disabled in base config; sweep whether enabling it helps.
  augmentation.polynomial_baseline[0].enabled:
    suggest: categorical
    choices: [true, false]

  augmentation.polynomial_baseline[0].ratio:
    suggest: float
    low: 0.2
    high: 0.9

  # ── augmentation: white noise ────────────────────────────────────────────
  # Disabled in base config; sweep whether enabling it helps.
  augmentation.noise.enabled:
    suggest: categorical
    choices: [true, false]

  augmentation.noise.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.noise.max_level:
    suggest: float_log
    low: 1.0e-4
    high: 0.1
