# Hyperparameter sweep config for the textile (IR/FTIR) domain.
#
# Augmentation TYPES are fixed (from configs/domain/textile/data/default.yaml).
# Only numerical parameters are swept here.
#
# Note: textile has background_max=0.0, so background pixels are effectively
# absent. The polynomial_baseline[1] (background_only) augmentation will
# rarely/never fire — its ratio param is included for completeness.
#
# Run:
#   python sweep.py --domain textile
#   python sweep.py --domain textile --n-trials 100 --storage sqlite:///textile_sweep.db

study:
  name: textile_augmentation_sweep
  direction: maximize
  n_trials: 100

base_overrides: {}

# suggest types:
#   float      — uniform in [low, high]
#   float_log  — log-uniform (lr, scales, small noise levels)
#   int        — uniform integer in [low, high]
#   categorical — one of `choices`
#
# Augmentation list disambiguation:
#   augmentation.<type>[0].<param>  →  first entry with that type  (signal_only)
#   augmentation.<type>[1].<param>  →  second entry               (background_only)

params:
  # ── training / optimiser ──────────────────────────────────────────────────
  model.lr:
    suggest: float_log
    low: 5.0e-6
    high: 5.0e-4

  model.weight_decay:
    suggest: float_log
    low: 1.0e-4
    high: 1.0e-2

  data.batch_size:
    suggest: categorical
    choices: [32, 64, 128]

  # ── model architecture ────────────────────────────────────────────────────
  model.conv_channels:
    suggest: categorical
    choices: [16, 32, 64]

  model.kernel_size:
    suggest: categorical
    choices: [7, 11, 21]

  model.pred_dropout:
    suggest: float
    low: 0.0
    high: 0.5

  model.gamma:
    suggest: float
    low: 0.0
    high: 3.0

  # ── augmentation: Mie scattering (signal spectra, enabled) ────────────────
  augmentation.mie_scattering.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.mie_scattering.r_min:
    suggest: float
    low: 1.0
    high: 5.0

  augmentation.mie_scattering.r_max:
    suggest: float
    low: 10.0
    high: 25.0

  augmentation.mie_scattering.n_imag_max:
    suggest: float_log
    low: 1.0e-3
    high: 5.0e-1

  augmentation.mie_scattering.scale_max:
    suggest: float
    low: 3.0
    high: 8.0

  # ── augmentation: polynomial baseline — signal (enabled) ─────────────────
  augmentation.polynomial_baseline[0].ratio:
    suggest: float
    low: 0.2
    high: 0.9

  # ── augmentation: polynomial baseline — background (enabled, rarely fires)
  augmentation.polynomial_baseline[1].ratio:
    suggest: float
    low: 0.2
    high: 0.9

  # ── augmentation: white noise (enabled) ──────────────────────────────────
  augmentation.noise.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.noise.max_level:
    suggest: float_log
    low: 1.0e-4
    high: 0.05
