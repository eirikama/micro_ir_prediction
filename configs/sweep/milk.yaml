# Hyperparameter sweep config for the PCUK (IR tissue) domain.
#
# Run:
#   python sweep.py --domain pcuk --n-trials 100
#   python sweep.py --domain pcuk --n-trials 100 --storage sqlite:///pcuk_sweep.db
#
# Augmentation TYPES are fixed (from configs/domain/pcuk/data/default.yaml).
# Only numerical parameters are swept here.

study:
  name: pcuk_augmentation_sweep
  direction: maximize
  n_trials: 100

base_overrides:
  data.augment_train: True

params:
  # ── training / optimiser ──────────────────────────────────────────────────
  model.lr:
    suggest: float_log
    low: 5.0e-6
    high: 5.0e-4

  model.weight_decay:
    suggest: float_log
    low: 1.0e-4
    high: 1.0e-2

  data.batch_size:
    suggest: categorical
    choices: [32, 64, 128]

  # ── model architecture ────────────────────────────────────────────────────
  model.conv_channels:
    suggest: categorical
    choices: [16, 32, 64]

  model.kernel_size:
    suggest: categorical
    choices: [7, 11, 21]

  model.pred_dropout:
    suggest: float
    low: 0.0
    high: 0.5

  model.gamma:
    suggest: float
    low: 0.0
    high: 3.0

  # ── augmentation: polynomial baseline ────────────────────────────────────
  # Simulates residual baseline drift after correction — physically motivated
  # for FFPE FTIR where scattering and substrate variation cause slow baseline
  # undulations. Coefficients correspond to polynomial terms [c1, c2, c3, c4].
  augmentation.polynomial_baseline_signal.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.polynomial_baseline_signal.param_ranges[0][1]:   # linear max
    suggest: float
    low: 0.1
    high: 1.0

  augmentation.polynomial_baseline_signal.param_ranges[1][0]:   # quadratic min
    suggest: float
    low: 0.0
    high: 0.5

  augmentation.polynomial_baseline_signal.param_ranges[1][1]:   # quadratic max
    suggest: float
    low: 0.5
    high: 4.0

  augmentation.polynomial_baseline_signal.param_ranges[2][1]:   # cubic max
    suggest: float_log
    low: 1.0e-4
    high: 1.0e-2

  # ── augmentation: noise ───────────────────────────────────────────────────
  # Simulates detector noise — scale to FTIR RMSD (~1.5e-3 median from paper).
  # max_level upper bound kept below 0.05 to avoid destroying fingerprint peaks.
  augmentation.noise.ratio:
    suggest: float
    low: 0.1
    high: 0.9

  augmentation.noise.max_level:
    suggest: float_log
    low: 5.0e-4
    high: 2.0e-2

  # ── augmentation: CO2 peaks ───────────────────────────────────────────────
  # CO2 absorption bands at 2300-2400 cm-1 are a real FTIR artefact from
  # incomplete atmospheric purging. Sweeping ratio and amplitude only —
  # peak positions and widths are physically fixed.
  augmentation.co2_peaks.enabled:
    suggest: categorical
    choices: [true, false]

  augmentation.co2_peaks.ratio:
    suggest: float
    low: 0.05
    high: 0.5

  augmentation.co2_peaks.params[4]:    # amplitude max
    suggest: float
    low: 0.05
    high: 0.8

  augmentation.paraffin.enabled:
    suggest: categorical
    choices: [true, false]

  augmentation.paraffin.ratio:
    suggest: float
    low: 0.1
    high: 0.5

  augmentation.paraffin.amplitude_max:
    suggest: float_log
    low: 0.0001
    high: 0.3
