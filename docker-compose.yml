version: "3.8"

services:
  train:
    build: .
    image: microplastics-predict:latest
    runtime: nvidia                      # GPU access
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # mount data drives — read only
      - /mnt/ssd2:/mnt/ssd2:ro
      - /mnt/ssd3:/mnt/ssd3:ro
      # mount outputs — read write
      - /home/eirikmagnussen/Projects/microplastics/outputs:/app/outputs
      - /home/eirikmagnussen/Projects/microplastics/mlruns:/app/mlruns
      - /home/eirikmagnussen/Projects/microplastics/mlflow.db:/app/mlflow.db
      - /home/eirikmagnussen/Projects/microplastics/checkpoints:/app/checkpoints
    command: >
      python main.py
      mode=all
      data.spectra_per_plastic=64
      seed=0

  mlflow-ui:
    build: .
    image: microplastics-predict:latest
    ports:
      - "5000:5000"
    volumes:
      - /home/eirikmagnussen/Projects/microplastics/mlflow.db:/app/mlflow.db
    command: >
      mlflow ui
      --backend-store-uri sqlite:////app/mlflow.db
      --host 0.0.0.0
      --port 5000
```

**`.dockerignore`** — keep the image small:
```
__pycache__/
*.pyc
*.pyo
.ipynb_checkpoints/
outputs/
multirun/
lightning_logs/
mlruns/
mlflow.db
checkpoints/
*.lmdb
*.zarr
*.so
*.egg-info/
.git/
notebooks/
