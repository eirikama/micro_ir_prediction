version: "3.8"

# ── Shared volume blocks ───────────────────────────────────────────────────────
# Kept as YAML anchors to avoid repetition across services.
# All host paths are relative to PROJECT_DIR (set in .env).
x-data-volumes: &data-volumes
  - /mnt/ssd2:/mnt/ssd2:ro
  - /mnt/ssd3:/mnt/ssd3:ro

x-output-volumes: &output-volumes
  - ${PROJECT_DIR}/outputs:/app/outputs          # predictions, raw outputs
  - ${PROJECT_DIR}/checkpoints:/app/checkpoints  # best model checkpoints
  - ${PROJECT_DIR}/mlruns:/app/mlruns            # MLflow artifact store
  - ${PROJECT_DIR}/multirun:/app/multirun        # Hydra sweep trial outputs
  - ${PROJECT_DIR}/sweeps:/app/sweeps            # Optuna .db files
  - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db      # MLflow tracking database

x-code-volumes: &code-volumes
  - ${PROJECT_DIR}/.git:/app/.git:ro
  - ${PROJECT_DIR}/main.py:/app/main.py
  - ${PROJECT_DIR}/sweep.py:/app/sweep.py
  - ${PROJECT_DIR}/configs:/app/configs
  - ${PROJECT_DIR}/src/configs:/app/src/configs
  - ${PROJECT_DIR}/src/data:/app/src/data
  - ${PROJECT_DIR}/src/training:/app/src/training
  - ${PROJECT_DIR}/src/inference:/app/src/inference
  - ${PROJECT_DIR}/src/models:/app/src/models
  - ${PROJECT_DIR}/src/utils.py:/app/src/utils.py

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-base-env: &base-env
  - NVIDIA_VISIBLE_DEVICES=all
  - HYDRA_FULL_ERROR=1
  - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0

services:
  train:
    profiles: ["donotstart"]
    build: .
    image: microplastics-predict:latest
    <<: *gpu
    environment: *base-env
    volumes:
      - *data-volumes
      - *output-volumes
      - *code-volumes
    command: >
      python main.py
      mode=all
      data.spectra_per_class=64
      seed=0

  mlflow-ui:
    image: microplastics-predict:latest
    ports:
      - "5000:5000"
    environment:
      - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0
    volumes:
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
      - ${PROJECT_DIR}/mlruns:/app/mlruns        # artifacts must be visible here too
    command: >
      mlflow ui
      --backend-store-uri sqlite:////app/mlflow.db
      --host 0.0.0.0
      --port 5000

  optuna-dashboard:
    profiles: ["donotstart"]
    image: microplastics-predict:latest
    ports:
      - "8080:8080"
    environment:
      - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0
    volumes:
      - ${PROJECT_DIR}/sweeps:/app/sweeps:ro
    command: >
      optuna-dashboard
      --host 0.0.0.0
      --port 8080
      sqlite:////app/sweeps/${SWEEP_DB:-microplastic_sweep.db}

  jupyter:
    build: .
    image: microplastics-predict:latest
    <<: *gpu
    environment: *base-env
    ports:
      - "8888:8888"
    volumes:
      - *data-volumes
      - *output-volumes
      - *code-volumes
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''
      --ServerApp.password=''
      --notebook-dir=/app
    working_dir: /app
