version: "3.8"

services:
  train:
    build: .
    image: microplastics-predict:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - /mnt/ssd2:/mnt/ssd2:ro
      - /mnt/ssd3:/mnt/ssd3:ro
      - ${PROJECT_DIR}/outputs:/app/outputs
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
      - ${PROJECT_DIR}/checkpoints:/app/checkpoints
    command: >
      python main.py
      mode=all
      data.spectra_per_plastic=64
      seed=0

  mlflow-ui:
    image: microplastics-predict:latest
    ports:
      - "5000:5000"
    volumes:
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
    command: >
      mlflow ui
      --backend-store-uri sqlite:////app/mlflow.db
      --host 0.0.0.0
      --port 5000