version: "3.8"

# ── Reusable blocks (mappings only — YAML merge <<: works for dicts, not lists)
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-base-env: &base-env
  - NVIDIA_VISIBLE_DEVICES=all
  - HYDRA_FULL_ERROR=1
  - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0
  - PYTHONPATH=/app
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

services:
  train:
    profiles: ["donotstart"]
    build: .
    image: microplastics-predict:latest
    <<: *gpu
    environment: *base-env
    volumes:
      # data (read-only)
      - /mnt/ssd2:/mnt/ssd2:ro
      - /mnt/ssd3:/mnt/ssd3:ro
      # outputs
      - ${PROJECT_DIR}/outputs:/app/outputs
      - ${PROJECT_DIR}/checkpoints:/app/checkpoints
      - ${PROJECT_DIR}/mlruns:/app/mlruns
      - ${PROJECT_DIR}/multirun:/app/multirun
      - ${PROJECT_DIR}/sweeps:/app/sweeps
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
      # code (live-editable without rebuild)
      - ${PROJECT_DIR}/.git:/app/.git:ro
      - ${PROJECT_DIR}/main.py:/app/main.py
      - ${PROJECT_DIR}/sweep.py:/app/sweep.py
      - ${PROJECT_DIR}/configs:/app/configs
      - ${PROJECT_DIR}/src/data:/app/src/data
      - ${PROJECT_DIR}/src/pipeline:/app/src/pipeline
      - ${PROJECT_DIR}/src/tracking:/app/src/tracking
      - ${PROJECT_DIR}/src/training:/app/src/training
      - ${PROJECT_DIR}/src/inference:/app/src/inference
      - ${PROJECT_DIR}/src/models:/app/src/models
      - ${PROJECT_DIR}/src/utils.py:/app/src/utils.py
      - ${PROJECT_DIR}/src/config_schema.py:/app/src/config_schema.py
    command: >
      python main.py
      mode=all
      data.spectra_per_class=64
      seed=0

  mlflow-ui:
    image: microplastics-predict:latest
    ports:
      - "5000:5000"
    environment:
      - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0
    volumes:
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
      - ${PROJECT_DIR}/mlruns:/app/mlruns
    command: >
      mlflow ui
      --backend-store-uri sqlite:////app/mlflow.db
      --host 0.0.0.0
      --port 5000

  optuna-dashboard:
    profiles: ["donotstart"]
    image: microplastics-predict:latest
    ports:
      - "8080:8080"
    environment:
      - LD_PRELOAD=/usr/local/lib/libsqlite3.so.0
    volumes:
      - ${PROJECT_DIR}/sweeps:/app/sweeps
    command: >
      optuna-dashboard
      --host 0.0.0.0
      --port 8080
      sqlite:////app/sweeps/${SWEEP_DB:-microplastic_sweep.db}

  jupyter:
    build: .
    image: microplastics-predict:latest
    <<: *gpu
    environment: *base-env
    ports:
      - "8888:8888"
    volumes:
      # data (read-only)
      - /mnt/ssd2:/mnt/ssd2:ro
      - /mnt/ssd3:/mnt/ssd3:ro
      # outputs
      - ${PROJECT_DIR}/outputs:/app/outputs
      - ${PROJECT_DIR}/checkpoints:/app/checkpoints
      - ${PROJECT_DIR}/mlruns:/app/mlruns
      - ${PROJECT_DIR}/multirun:/app/multirun
      - ${PROJECT_DIR}/sweeps:/app/sweeps
      - ${PROJECT_DIR}/mlflow.db:/app/mlflow.db
      # code
      - ${PROJECT_DIR}/.git:/app/.git:ro
      - ${PROJECT_DIR}/main.py:/app/main.py
      - ${PROJECT_DIR}/sweep.py:/app/sweep.py
      - ${PROJECT_DIR}/configs:/app/configs
      - ${PROJECT_DIR}/src/configs:/app/src/configs
      - ${PROJECT_DIR}/src/data:/app/src/data
      - ${PROJECT_DIR}/src/training:/app/src/training
      - ${PROJECT_DIR}/src/inference:/app/src/inference
      - ${PROJECT_DIR}/src/models:/app/src/models
      - ${PROJECT_DIR}/src/utils.py:/app/src/utils.py
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''
      --ServerApp.password=''
      --notebook-dir=/app
    working_dir: /app
